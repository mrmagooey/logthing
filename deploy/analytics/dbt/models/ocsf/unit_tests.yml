  - name: detection_finding_maps_suricata_alerts_and_ignores_other_events
    model: ocsf_detection_finding
    given:
      - input: ref('stg_suricata')
        format: sql
        rows: |
          select cast('alert' as varchar) as event_type,
                 cast('2026-10-01 12:00:10 UTC' as timestamp(6) with time zone) as received_at,
                 cast('10.0.0.8' as varchar) as src_ip,
                 cast('{"timestamp": "2026-10-01T12:00:00.123456+0000", "src_ip": "10.0.0.8", "src_port": 4444, "dest_ip": "198.51.100.7", "dest_port": 22, "proto": "TCP", "alert": {"signature": "ET SCAN test", "signature_id": 2001219, "severity": 1, "category": "Attempted Recon", "action": "allowed"}}' as varchar) as payload
          union all
          select 'dns', cast('2026-10-01 12:00:11 UTC' as timestamp(6) with time zone), '10.0.0.8', '{}'
          union all
          select 'alert', cast('2026-10-01 12:00:20 UTC' as timestamp(6) with time zone), '10.0.0.9',
                 '{"timestamp": "garbage", "dest_ip": "198.51.100.8", "alert": {"signature": "ET MISC", "signature_id": 2001220, "severity": 3}}'
    expect:
      format: dict
      rows:
        - class_uid: 2004
          type_uid: 200401
          finding_info_title: 'ET SCAN test'
          finding_info_uid: '2001219'
          severity_id: 4
          src_endpoint_ip: '10.0.0.8'
          dst_endpoint_ip: '198.51.100.7'
          dst_endpoint_port: 22
          connection_info_protocol_name: 'tcp'
          disposition_name: 'allowed'
          time: '2026-10-01 12:00:00.123456 UTC'
        - class_uid: 2004
          type_uid: 200401
          finding_info_title: 'ET MISC'
          finding_info_uid: '2001220'
          severity_id: 2
          src_endpoint_ip: '10.0.0.9'
          dst_endpoint_ip: '198.51.100.8'
          dst_endpoint_port: null
          connection_info_protocol_name: null
          disposition_name: null
          time: '2026-10-01 12:00:20 UTC'
