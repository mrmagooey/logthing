                 '{"raw_xml": "<Event><EventData><Data Name=\"TargetUserName\">john.doe</Data><Data Name=\"TargetDomainName\">CONTOSO</Data></EventData></Event>", "parsed": {"event_id": 4634, "computer": "WS01.contoso.com", "time_created": "2026-10-01T12:02:00Z", "data": null}}'
          union all
