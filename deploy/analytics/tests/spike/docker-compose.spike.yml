# Throwaway-but-reproducible spike: Trino (HTTPS + password) + certgen + authgen + Metabase.
# Not part of the stack. Paths are relative to this file.
name: lt-spike
services:
  certgen:
    image: alpine/openssl:3.5.9
    entrypoint: ["sh", "/certgen.sh"]
    environment:
      OUT_DIR: /tls
      TLS_OWNER: "1000:1000"
    volumes:
      - ../../scripts/certgen.sh:/certgen.sh:ro
      - tls:/tls
    restart: "no"

  authgen:
    image: httpd:2.4.69-alpine
    entrypoint: ["sh", "/authgen.sh"]
    environment:
      OUT_DIR: /auth
      TRINO_USERS: admin:TRINO_ADMIN_PASSWORD,metabase:TRINO_METABASE_PASSWORD
      TRINO_ADMIN_PASSWORD: ${TRINO_ADMIN_PASSWORD}
      TRINO_METABASE_PASSWORD: ${TRINO_METABASE_PASSWORD}
    volumes:
      - ../../helm/logthing-analytics/files/authgen.sh:/authgen.sh:ro
      - auth:/auth
    restart: "no"

  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:483}
    volumes:
      - ../../helm/logthing-analytics/files/trino-config.properties:/etc/trino/config.properties:ro
      - ../../helm/logthing-analytics/files/trino-password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - tls:/etc/trino/tls:ro
      - auth:/etc/trino/auth:ro
    environment:
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET}
      TRINO_PASSWORD: ${TRINO_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "trino --server https://localhost:8443 --truststore-path /etc/trino/tls/ca.pem --user admin --password --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 60
      start_period: 30s
    depends_on:
      certgen: {condition: service_completed_successfully}
      authgen: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1::8443"

  metabase:
    image: metabase/metabase:v0.64.1
    volumes:
      - tls:/tls:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    depends_on:
      certgen: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1::3000"

volumes:
  tls: {}
  auth: {}
