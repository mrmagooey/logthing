# Test-only override: publish Garage S3/admin, Lakekeeper, Trino HTTPS and Metabase on ephemeral loopback ports.
# The test reads the assigned ports back with `docker compose port`.
services:
  garage:
    ports: !override
      - "127.0.0.1::3900"
      - "127.0.0.1::3903"
  lakekeeper:
    ports: !override
      - "127.0.0.1::8181"
  trino:
    ports: !override
      - "127.0.0.1::8443"
  metabase:
    ports: !override
      - "127.0.0.1::3000"
