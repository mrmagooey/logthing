# Credentials. Leave every value empty and the chart generates random ones on first install and
# keeps them on upgrades (read back from the live Secret). Set a value to pin it. Or set
# existingSecret to a Secret with these keys: garage-rpc-secret garage-admin-token
# s3-access-key s3-secret-key postgres-password lakekeeper-db-password
# lakekeeper-encryption-key trino-admin-password trino-metabase-password
# trino-shared-secret.
# Values must be URL-safe ([A-Za-z0-9._~-]): they are spliced into Postgres URLs. The Garage key
# id must be GK + 24 lowercase hex, its secret 64 lowercase hex.
credentials:
  existingSecret: ""
  garageRpcSecret: ""
  garageAdminToken: ""
  s3AccessKey: ""
  s3SecretKey: ""
  postgresPassword: ""
  lakekeeperDbPassword: ""
  lakekeeperEncryptionKey: ""
  trinoAdminPassword: ""
  trinoMetabasePassword: ""
  trinoSharedSecret: ""

bootstrap:
  image: python:3.12-slim
  timeoutSecs: 600

postgres:
  image: postgres:17
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}

garage:
  image: dxflrs/garage:v2.4.1
  capacityBytes: 10737418240
  metaStorage: 1Gi
  dataStorage: 20Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}

lakekeeper:
  image: quay.io/lakekeeper/catalog:v0.13.6
  resources:
    requests: {cpu: 100m, memory: 128Mi}

logthing:
  image: ghcr.io/mrmagooey/logthing:0.21.0
  flushIntervalSecs: 60
  udpService:
    type: ClusterIP
  tcpService:
    type: ClusterIP
  resources:
    requests: {cpu: 100m, memory: 128Mi}

committer:
  image: ghcr.io/mrmagooey/logthing-committer:0.21.0
  schedule: "*/1 * * * *"
  resources:
    requests: {cpu: 100m, memory: 256Mi}

trino:
  image: trinodb/trino:483
  authgen:
    image: httpd:2.4.69-alpine
  tls:
    # Name of a Secret with keys ca.pem and server.pem (certificate chain + PKCS#8/PKCS#1 key)
    # whose certificate is valid for the Trino Service DNS name. Empty = the chart generates a
    # private CA and certificate (kept across upgrades via lookup; delete the <release>-trino-tls
    # Secret and upgrade to rotate).
    existingSecret: ""
  service:
    type: ClusterIP
  resources:
    requests: {memory: 2Gi}
    limits: {memory: 4Gi}

storageClassName: ""
