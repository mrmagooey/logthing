apiVersion: v1
kind: Service
metadata:
  name: {{ include "la.fullname" . }}-garage
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "la.selector" (dict "root" . "component" "garage") | nindent 4 }}
  ports:
    - {name: s3, port: 3900, targetPort: 3900}
    - {name: rpc, port: 3901, targetPort: 3901}
    - {name: admin, port: 3903, targetPort: 3903}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "la.fullname" . }}-garage
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "la.fullname" . }}-garage
  selector:
    matchLabels: {{- include "la.selector" (dict "root" . "component" "garage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "la.podLabels" (dict "root" . "component" "garage") | nindent 8 }}
    spec:
      containers:
        - name: garage
          # No command/args: the image default (/garage server) reads /etc/garage.toml.
          image: {{ .Values.garage.image }}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
            - {name: admin, containerPort: 3903}
          env:
            {{- include "la.secretEnv" (dict "root" . "name" "GARAGE_RPC_SECRET" "key" "garage-rpc-secret") | nindent 12 }}
            {{- include "la.secretEnv" (dict "root" . "name" "GARAGE_ADMIN_TOKEN" "key" "garage-admin-token") | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/garage", "status"]
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml}
            - {name: meta, mountPath: /var/lib/garage/meta}
            - {name: data, mountPath: /var/lib/garage/data}
          {{- with .Values.garage.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "la.fullname" . }}-files
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.garage.metaStorage }}
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.garage.dataStorage }}
