{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "la.fullname" . }}-credentials
  labels: {{- include "la.labels" . | nindent 4 }}
type: Opaque
stringData:
  garage-rpc-secret: {{ include "la.cred" (dict "root" . "key" "garage-rpc-secret" "field" "garageRpcSecret" "value" .Values.credentials.garageRpcSecret "gen" (randAlphaNum 64 | sha256sum)) | quote }}
  garage-admin-token: {{ include "la.cred" (dict "root" . "key" "garage-admin-token" "field" "garageAdminToken" "value" .Values.credentials.garageAdminToken "gen" (randAlphaNum 40)) | quote }}
  s3-access-key: {{ include "la.cred" (dict "root" . "key" "s3-access-key" "field" "s3AccessKey" "value" .Values.credentials.s3AccessKey "gen" (printf "GK%s" (randAlphaNum 64 | sha256sum | trunc 24))) | quote }}
  s3-secret-key: {{ include "la.cred" (dict "root" . "key" "s3-secret-key" "field" "s3SecretKey" "value" .Values.credentials.s3SecretKey "gen" (randAlphaNum 64 | sha256sum)) | quote }}
  postgres-password: {{ include "la.cred" (dict "root" . "key" "postgres-password" "field" "postgresPassword" "value" .Values.credentials.postgresPassword "gen" (randAlphaNum 32)) | quote }}
  lakekeeper-db-password: {{ include "la.cred" (dict "root" . "key" "lakekeeper-db-password" "field" "lakekeeperDbPassword" "value" .Values.credentials.lakekeeperDbPassword "gen" (randAlphaNum 32)) | quote }}
  lakekeeper-encryption-key: {{ include "la.cred" (dict "root" . "key" "lakekeeper-encryption-key" "field" "lakekeeperEncryptionKey" "value" .Values.credentials.lakekeeperEncryptionKey "gen" (randAlphaNum 48)) | quote }}
  hue-db-password: {{ include "la.cred" (dict "root" . "key" "hue-db-password" "field" "hueDbPassword" "value" .Values.credentials.hueDbPassword "gen" (randAlphaNum 32)) | quote }}
  hue-secret-key: {{ include "la.cred" (dict "root" . "key" "hue-secret-key" "field" "hueSecretKey" "value" .Values.credentials.hueSecretKey "gen" (randAlphaNum 48)) | quote }}
{{- end }}
