apiVersion: v1
kind: Service
metadata:
  name: {{ include "la.fullname" . }}-hue
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  type: {{ .Values.hue.service.type }}
  selector: {{- include "la.selector" (dict "root" . "component" "hue") | nindent 4 }}
  ports:
    - {name: http, port: 8888, targetPort: 8888}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "la.fullname" . }}-hue
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "la.selector" (dict "root" . "component" "hue") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "la.podLabels" (dict "root" . "component" "hue") | nindent 8 }}
      annotations:
        checksum/hue: {{ include (print $.Template.BasePath "/configmap-hue.yaml") . | sha256sum }}
        {{- if not .Values.credentials.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      initContainers:
        {{- include "la.waitHue" . | nindent 8 }}
      containers:
        - name: hue
          image: {{ .Values.hue.image }}
          ports:
            - {name: http, containerPort: 8888}
          env:
            {{- include "la.secretEnv" (dict "root" . "name" "HUE_DB_PASSWORD" "key" "hue-db-password") | nindent 12 }}
            {{- include "la.secretEnv" (dict "root" . "name" "HUE_SECRET_KEY" "key" "hue-secret-key") | nindent 12 }}
          readinessProbe:
            httpGet: {path: /desktop/debug/is_alive, port: 8888}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - {name: hue-ini, mountPath: /usr/share/hue/desktop/conf/z-hue-overrides.ini, subPath: z-hue-overrides.ini}
          {{- with .Values.hue.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: hue-ini
          configMap:
            name: {{ include "la.fullname" . }}-hue
