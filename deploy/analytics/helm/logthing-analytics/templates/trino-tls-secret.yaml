{{- if not .Values.trino.tls.existingSecret }}
{{- $fn := include "la.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-trino-tls" $fn }}
{{- $live := lookup "v1" "Secret" $ns $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "la.labels" . | nindent 4 }}
type: Opaque
data:
{{- if and $live $live.data (hasKey $live.data "server.pem") (hasKey $live.data "ca.pem") }}
  ca.pem: {{ index $live.data "ca.pem" }}
  server.pem: {{ index $live.data "server.pem" }}
{{- else }}
{{- $ca := genCA "logthing-analytics-ca" 3650 }}
{{- $sans := list (printf "%s-trino" $fn) (printf "%s-trino.%s" $fn $ns) (printf "%s-trino.%s.svc" $fn $ns) (printf "%s-trino.%s.svc.cluster.local" $fn $ns) "localhost" }}
{{- $cert := genSignedCert "trino" (list "127.0.0.1") $sans 825 $ca }}
  ca.pem: {{ $ca.Cert | b64enc }}
  server.pem: {{ printf "%s\n%s" $cert.Cert $cert.Key | b64enc }}
{{- end }}
{{- end }}
