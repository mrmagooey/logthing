apiVersion: v1
kind: Service
metadata:
  name: {{ include "la.fullname" . }}-postgres
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "la.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "la.fullname" . }}-postgres
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "la.fullname" . }}-postgres
  selector:
    matchLabels: {{- include "la.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "la.podLabels" (dict "root" . "component" "postgres") | nindent 8 }}
      annotations:
        checksum/files: {{ include (print $.Template.BasePath "/configmap-files.yaml") . | sha256sum }}
        {{- if not .Values.credentials.existingSecret }}
        checksum/secret: {{ include "la.credsum" . }}
        {{- end }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            {{- include "la.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            {{- include "la.secretEnv" (dict "root" . "name" "LAKEKEEPER_DB_PASSWORD" "key" "lakekeeper-db-password") | nindent 12 }}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            # TCP on purpose: the unix-socket check passes during the init-time temporary server.
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "lakekeeper"]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/10-init.sh, subPath: postgres-init.sh}
          {{- with .Values.postgres.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: init
          configMap:
            name: {{ include "la.fullname" . }}-files
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        labels:
          {{- include "la.stableLabels" $ | nindent 10 }}
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
