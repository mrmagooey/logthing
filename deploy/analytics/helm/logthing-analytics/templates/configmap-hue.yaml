apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "la.fullname" . }}-hue
  labels: {{- include "la.labels" . | nindent 4 }}
data:
  z-hue-overrides.ini: |
    # Hue overrides for the logthing analytics stack (Helm).
    # The Helm chart renders the same file with release-qualified hostnames; the two must stay
    # identical apart from the `postgres` and `trino` hostnames (enforced by a unit test).
    [desktop]
    secret_key_script=echo $HUE_SECRET_KEY
    http_host=0.0.0.0
    http_port=8888
    time_zone=UTC
    django_debug_mode=false
    http_500_debug_mode=false
    app_blacklist=search,hbase,security
    use_cherrypy_server=false
    gunicorn_work_class=sync
    gunicorn_number_of_workers=1

    [[database]]
    engine=postgresql_psycopg2
    host={{ include "la.fullname" . }}-postgres
    port=5432
    user=hue
    password_script=echo $HUE_DB_PASSWORD
    name=hue

    [notebook]
    show_notebooks=true
    [[interpreters]]
    [[[trino]]]
    name=Trino
    interface=trino
    options='{"url": "http://{{ include "la.fullname" . }}-trino:8080"}'

    [dashboard]
    has_sql_enabled=true
