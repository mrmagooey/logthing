apiVersion: v1
kind: Service
metadata:
  name: {{ include "la.fullname" . }}-logthing-udp
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  type: {{ .Values.logthing.udpService.type }}
  selector: {{- include "la.selector" (dict "root" . "component" "logthing") | nindent 4 }}
  ports:
    - {name: syslog-udp, port: 514, targetPort: 514, protocol: UDP}
    - {name: ipfix, port: 4739, targetPort: 4739, protocol: UDP}
    - {name: sflow, port: 6343, targetPort: 6343, protocol: UDP}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "la.fullname" . }}-logthing-tcp
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  type: {{ .Values.logthing.tcpService.type }}
  selector: {{- include "la.selector" (dict "root" . "component" "logthing") | nindent 4 }}
  ports:
    - {name: syslog-tcp, port: 601, targetPort: 601, protocol: TCP}
    - {name: zeek, port: 47760, targetPort: 47760, protocol: TCP}
    - {name: http, port: 5985, targetPort: 5985, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "la.fullname" . }}-logthing
  labels: {{- include "la.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "la.selector" (dict "root" . "component" "logthing") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "la.podLabels" (dict "root" . "component" "logthing") | nindent 8 }}
      annotations:
        checksum/files: {{ include (print $.Template.BasePath "/configmap-files.yaml") . | sha256sum }}
        {{- if not .Values.credentials.existingSecret }}
        checksum/secret: {{ include "la.credsum" . }}
        {{- end }}
    spec:
      initContainers:
        {{- include "la.waitFor" (dict "root" . "target" "garage") | nindent 8 }}
        # Refuse to start with an empty token: logthing only warns and would then serve the
        # HEC / OTLP endpoints unauthenticated (possible with credentials.existingSecret).
        - name: require-tokens
          image: {{ .Values.bootstrap.image }}
          command:
            - sh
            - -c
            - |
              for v in HEC_TOKEN OTLP_BEARER_TOKEN; do
                eval "val=\$$v"
                if [ -z "$val" ]; then
                  echo "ERROR: Secret key for $v (hec-token / otlp-bearer-token) is empty; refusing to start logthing with unauthenticated HEC/OTLP endpoints" >&2
                  exit 1
                fi
              done
          env:
            {{- include "la.secretEnv" (dict "root" . "name" "HEC_TOKEN" "key" "hec-token") | nindent 12 }}
            {{- include "la.secretEnv" (dict "root" . "name" "OTLP_BEARER_TOKEN" "key" "otlp-bearer-token") | nindent 12 }}
      containers:
        - name: logthing
          image: {{ .Values.logthing.image }}
          ports:
            - {name: syslog-udp, containerPort: 514, protocol: UDP}
            - {name: syslog-tcp, containerPort: 601, protocol: TCP}
            - {name: ipfix, containerPort: 4739, protocol: UDP}
            - {name: sflow, containerPort: 6343, protocol: UDP}
            - {name: zeek, containerPort: 47760, protocol: TCP}
            - {name: http, containerPort: 5985, protocol: TCP}
          env:
            {{- range $sec := list "SYSLOG" "IPFIX" "SFLOW" "ZEEK" "HEC" "OTLP" "ICEBERG" }}
            - name: LOGTHING__{{ $sec }}__S3__ENDPOINT
              value: http://{{ include "la.fullname" $ }}-garage:3900
            {{- include "la.secretEnv" (dict "root" $ "name" (printf "LOGTHING__%s__S3__ACCESS_KEY" $sec) "key" "s3-access-key") | nindent 12 }}
            {{- include "la.secretEnv" (dict "root" $ "name" (printf "LOGTHING__%s__S3__SECRET_KEY" $sec) "key" "s3-secret-key") | nindent 12 }}
            {{- if ne $sec "ICEBERG" }}
            - name: LOGTHING__{{ $sec }}__S3__FLUSH_INTERVAL_SECS
              value: {{ $.Values.logthing.flushIntervalSecs | quote }}
            {{- end }}
            {{- end }}
            {{- include "la.secretEnv" (dict "root" . "name" "LOGTHING__HEC__TOKEN" "key" "hec-token") | nindent 12 }}
            {{- include "la.secretEnv" (dict "root" . "name" "LOGTHING__OTLP__BEARER_TOKEN" "key" "otlp-bearer-token") | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: 5985}
            periodSeconds: 5
          volumeMounts:
            - {name: files, mountPath: /etc/logthing/config.toml, subPath: logthing.toml}
          {{- with .Values.logthing.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "la.filesVolume" . | nindent 8 }}
