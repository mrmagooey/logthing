# Single-node Garage for the logthing analytics stack.
# rpc_secret and admin_token are deliberately absent: Garage reads them from the
# GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN environment variables.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "0.0.0.0:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
