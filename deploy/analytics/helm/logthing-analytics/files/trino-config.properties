# Trino coordinator (single node) for the logthing analytics stack.
# External clients: HTTPS only (8443), PASSWORD authentication (see
# trino-password-authenticator.properties). TLS material comes from /etc/trino/tls
# (compose: certgen; Helm: <release>-trino-tls Secret).
# Topology B: the plain-HTTP listener on 8080 exists only for Trino's own internal
# node-to-node traffic (authenticated by the shared secret). Compose never publishes 8080
# and the Helm Service exposes only 8443. Internal HTTPS is not used because Trino nodes
# address each other by pod/container IP, which the generated certificate cannot cover.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
http-server.http.enabled=true
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/server.pem
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
