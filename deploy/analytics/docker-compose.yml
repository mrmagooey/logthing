# logthing analytics stack: logthing -> Garage (S3) -> committer -> Lakekeeper (Iceberg REST)
# -> Trino -> Metabase. Shared config files live in helm/logthing-analytics/files/ and are used
# unchanged by the Helm chart. Secrets are REQUIRED (no defaults): run scripts/gen-analytics-env.sh.
name: logthing-analytics

x-s3-creds: &s3-creds
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set LAKEKEEPER_ENCRYPTION_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}@postgres:5432/lakekeeper
  LAKEKEEPER__BASE_URI: http://lakekeeper:8181

x-bootstrap: &bootstrap
  image: ${BOOTSTRAP_IMAGE:-python:3.12-slim}
  entrypoint: ["python", "/bootstrap/bootstrap.py"]
  volumes:
    - ./helm/logthing-analytics/files/bootstrap.py:/bootstrap/bootstrap.py:ro
  restart: "no"

x-logthing-s3: &logthing-s3
  LOGTHING__SYSLOG__S3__ENDPOINT: http://garage:3900
  LOGTHING__SYSLOG__S3__ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__SYSLOG__S3__SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__SYSLOG__S3__FLUSH_INTERVAL_SECS: ${LOGTHING_FLUSH_INTERVAL_SECS:-60}
  LOGTHING__IPFIX__S3__ENDPOINT: http://garage:3900
  LOGTHING__IPFIX__S3__ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__IPFIX__S3__SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__IPFIX__S3__FLUSH_INTERVAL_SECS: ${LOGTHING_FLUSH_INTERVAL_SECS:-60}
  LOGTHING__SFLOW__S3__ENDPOINT: http://garage:3900
  LOGTHING__SFLOW__S3__ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__SFLOW__S3__SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__SFLOW__S3__FLUSH_INTERVAL_SECS: ${LOGTHING_FLUSH_INTERVAL_SECS:-60}
  LOGTHING__ZEEK__S3__ENDPOINT: http://garage:3900
  LOGTHING__ZEEK__S3__ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__ZEEK__S3__SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__ZEEK__S3__FLUSH_INTERVAL_SECS: ${LOGTHING_FLUSH_INTERVAL_SECS:-60}
  LOGTHING__HEC__S3__ENDPOINT: http://garage:3900
  LOGTHING__HEC__S3__ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__HEC__S3__SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__HEC__S3__FLUSH_INTERVAL_SECS: ${LOGTHING_FLUSH_INTERVAL_SECS:-60}
  LOGTHING__HEC__TOKEN: ${HEC_TOKEN:?set HEC_TOKEN (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__OTLP__S3__ENDPOINT: http://garage:3900
  LOGTHING__OTLP__S3__ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__OTLP__S3__SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__OTLP__S3__FLUSH_INTERVAL_SECS: ${LOGTHING_FLUSH_INTERVAL_SECS:-60}
  LOGTHING__OTLP__BEARER_TOKEN: ${OTLP_BEARER_TOKEN:?set OTLP_BEARER_TOKEN (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__ICEBERG__S3__ENDPOINT: http://garage:3900
  LOGTHING__ICEBERG__S3__ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
  LOGTHING__ICEBERG__S3__SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?set METABASE_DB_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
    volumes:
      - ./helm/logthing-analytics/files/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: the unix-socket check passes during the init-time temporary server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lakekeeper"]
      interval: 2s
      timeout: 5s
      retries: 30

  garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.4.1}
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (run deploy/analytics/scripts/gen-analytics-env.sh)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (run deploy/analytics/scripts/gen-analytics-env.sh)}
    volumes:
      - ./helm/logthing-analytics/files/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - "${ANALYTICS_BIND_ADDR:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900"

  garage-init:
    <<: *bootstrap
    command: ["garage"]
    environment:
      <<: *s3-creds
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (run deploy/analytics/scripts/gen-analytics-env.sh)}
    depends_on:
      garage: {condition: service_healthy}

  lakekeeper-migrate:
    image: ${LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.13.6}
    command: ["migrate"]
    environment: *lakekeeper-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  lakekeeper:
    image: ${LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.13.6}
    restart: unless-stopped
    command: ["serve"]
    environment: *lakekeeper-env
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}

  lakekeeper-init:
    <<: *bootstrap
    command: ["lakekeeper"]
    environment: *s3-creds
    depends_on:
      lakekeeper: {condition: service_healthy}
      garage-init: {condition: service_completed_successfully}

  logthing:
    image: ${LOGTHING_IMAGE:-ghcr.io/mrmagooey/logthing:0.22.0}
    volumes:
      - ./helm/logthing-analytics/files/logthing.toml:/etc/logthing/config.toml:ro
    environment: *logthing-s3
    depends_on:
      garage-init: {condition: service_completed_successfully}
    restart: unless-stopped
    ports:
      - "${SYSLOG_UDP_PORT:-514}:514/udp"
      - "${SYSLOG_TCP_PORT:-601}:601/tcp"
      - "${IPFIX_PORT:-4739}:4739/udp"
      - "${SFLOW_PORT:-6343}:6343/udp"
      - "${ZEEK_PORT:-47760}:47760/tcp"
      # 5985: HTTP ingest (OTLP /v1/logs, HEC /services/collector/event) plus /health.
      - "${LOGTHING_HEALTH_PORT:-5985}:5985/tcp"

  committer:
    image: ${COMMITTER_IMAGE:-ghcr.io/mrmagooey/logthing-committer:0.22.0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Run in the background so SIGTERM is handled promptly even mid-run. A commit cut
        # short is safe: descriptors only move after a successful commit (crash-safe).
        trap 'exit 0' TERM INT
        while true; do
          python /app/commit.py & wait $$! || echo "committer: run failed (will retry)"
          sleep "$${COMMIT_INTERVAL_SECS}" & wait $$!
        done
    environment:
      <<: *s3-creds
      DATA_BUCKET: logthing-data
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      CATALOG_URI: http://lakekeeper:8181/catalog
      WAREHOUSE: logthing
      ICEBERG_NAMESPACE: logs
      COMMIT_INTERVAL_SECS: ${COMMIT_INTERVAL_SECS:-60}
    depends_on:
      lakekeeper-init: {condition: service_completed_successfully}
    restart: unless-stopped

  certgen:
    image: ${CERTGEN_IMAGE:-alpine/openssl:3.5.9}
    entrypoint: ["sh", "/certgen.sh"]
    environment:
      OUT_DIR: /tls
      TLS_OWNER: "1000:1000"
      # A copy of ca.pem only: what Metabase mounts (it must never see server.pem).
      CA_COPY_DIR: /ca
    volumes:
      - ./scripts/certgen.sh:/certgen.sh:ro
      - trino-tls:/tls
      - trino-ca:/ca
    restart: "no"

  authgen:
    image: ${AUTHGEN_IMAGE:-httpd:2.4.69-alpine}
    entrypoint: ["sh", "/authgen.sh"]
    environment:
      OUT_DIR: /auth
      TRINO_USERS: admin:TRINO_ADMIN_PASSWORD,metabase:TRINO_METABASE_PASSWORD
      TRINO_ADMIN_PASSWORD: ${TRINO_ADMIN_PASSWORD:?set TRINO_ADMIN_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
      TRINO_METABASE_PASSWORD: ${TRINO_METABASE_PASSWORD:?set TRINO_METABASE_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
    volumes:
      - ./helm/logthing-analytics/files/authgen.sh:/authgen.sh:ro
      - trino-auth:/auth
    restart: "no"

  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:483}
    restart: unless-stopped
    volumes:
      - ./helm/logthing-analytics/files/trino-config.properties:/etc/trino/config.properties:ro
      - ./helm/logthing-analytics/files/trino-password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./helm/logthing-analytics/files/trino-iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - trino-tls:/etc/trino/tls:ro
      - trino-auth:/etc/trino/auth:ro
    environment:
      <<: *s3-creds
      CATALOG_URI: http://lakekeeper:8181/catalog
      S3_ENDPOINT: http://garage:3900
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET:?set TRINO_SHARED_SECRET (run deploy/analytics/scripts/gen-analytics-env.sh)}
      # Read by the trino CLI (healthcheck and `docker compose exec trino trino ...`).
      TRINO_PASSWORD: ${TRINO_ADMIN_PASSWORD:?set TRINO_ADMIN_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
    healthcheck:
      test: ["CMD-SHELL", "trino --server https://localhost:8443 --truststore-path /etc/trino/tls/ca.pem --user admin --password --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 60
      start_period: 30s
    depends_on:
      lakekeeper-init: {condition: service_completed_successfully}
      certgen: {condition: service_completed_successfully}
      authgen: {condition: service_completed_successfully}
    # 8080 (plain HTTP, internal node traffic only) is deliberately never published.
    ports:
      - "${ANALYTICS_BIND_ADDR:-127.0.0.1}:${TRINO_PORT:-8443}:8443"

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.64.1}
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?set METABASE_DB_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
      # Encrypts the Trino credentials stored in Metabase's application database.
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?set METABASE_ENCRYPTION_KEY (run deploy/analytics/scripts/gen-analytics-env.sh)}
    volumes:
      # Only the public CA (copied by certgen), never the Trino private key in server.pem.
      - trino-ca:/tls:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      # First start runs all of Metabase's schema migrations. A slow host needs far more than
      # the default (e.g. METABASE_HEALTH_RETRIES=180 allows ~30 minutes).
      retries: ${METABASE_HEALTH_RETRIES:-40}
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
      certgen: {condition: service_completed_successfully}
    ports:
      - "${ANALYTICS_BIND_ADDR:-127.0.0.1}:${METABASE_PORT:-3000}:3000"

  metabase-init:
    <<: *bootstrap
    command: ["metabase"]
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@logthing.example}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?set METABASE_ADMIN_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
      TRINO_HOST: trino
      TRINO_PORT: "8443"
      TRINO_METABASE_USER: metabase
      TRINO_METABASE_PASSWORD: ${TRINO_METABASE_PASSWORD:?set TRINO_METABASE_PASSWORD (run deploy/analytics/scripts/gen-analytics-env.sh)}
      TRINO_TLS_MODE: ${METABASE_TRINO_TLS_MODE:-pem}
      TRINO_CA_PATH: /tls/ca.pem
    depends_on:
      metabase: {condition: service_healthy}
      trino: {condition: service_healthy}

volumes:
  trino-ca: {}
  pgdata: {}
  garage-meta: {}
  garage-data: {}
  trino-tls: {}
  trino-auth: {}
