[package]
name = "logthing"
version = "0.13.3"
edition = "2024"

[workspace]
members = ["tools/loadgen"]
# Plain `cargo build`/`cargo test`/`cargo clippy` at the repo root (what
# rust.yml runs on every push) must keep building/testing ONLY the logthing
# package -- tools/loadgen is a manually-invoked concern
# (docs/superpowers/plans/2026-07-24-performance-testing-infrastructure.md),
# not a per-push one.
default-members = ["."]

[features]
default = ["otlp"]
kerberos-auth = ["axum-negotiate"]
otlp = ["dep:opentelemetry-proto", "dep:prost"]
pprof = ["dep:pprof"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
axum-negotiate = { version = "0.1.1", optional = true }
headers = "0.4"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
hyper = { version = "1.0", features = ["full"] }

# TLS/SSL
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"

# XML parsing for WEF events
quick-xml = { version = "0.31", features = ["serialize"] }

# Configuration
config = "0.14"
serde_yml = "0.0.12"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.22"
# default-features disabled: we only use `PrometheusBuilder::build_recorder()`, not the
# http-listener/push-gateway features — dropping them removes the unused native-tls/openssl-sys
# C dependency, which keeps static musl release builds buildable and shrinks the binary.
metrics-exporter-prometheus = { version = "0.13", default-features = false }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# IP/network utilities
ipnet = "2.9"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"

# HTTP client for tests / admin proxy
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Parquet file handling
parquet = { version = "53.0", features = ["async", "arrow"] }
arrow = "53.0"
arrow-array = "53.0"
arrow-schema = "53.0"

# S3 SDK
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.15"
aws-credential-types = "1.1"

# Additional utilities
tempfile = "3.9"
bytes = "1.5"
regex = "1.10"
async-trait = "0.1"
hex = "0.4.3"
aho-corasick = "1.1"

# Security
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
rand = "0.9.2"
subtle = "2"

# OTLP ingest (feature-gated)
# opentelemetry-proto 0.32 uses prost 0.14 (brief suggested 0.7/prost-0.13 but actual latest is 0.32/prost-0.14)
# `logs` feature is required to gate tonic::logs::v1 and tonic::collector::logs::v1 modules
# `trace` is omitted — not needed for logs-only ingest
opentelemetry-proto = { version = "0.32", optional = true, default-features = false, features = [
    "gen-tonic-messages",
    "with-serde",
    "logs",
] }
prost = { version = "0.14", optional = true }

# CPU sampling profiler. Optional and excluded from `default` on purpose:
# binaries.yml cross-compiles static musl with default features only, and this
# repo has a history of C dependencies breaking those builds.
# `protobuf-codec` (pure-Rust rust-protobuf 2.x) rather than `prost-codec`:
# pprof 0.14 pins prost ^0.12 while this crate resolves prost 0.14, so
# prost-codec would add a second, incompatible prost rather than reuse ours.
pprof = { version = "0.14", default-features = false, features = [
    "flamegraph",
    "protobuf-codec",
], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
metrics-util = { version = "0.16", features = ["debugging"] }
criterion = "0.5"

[[bench]]
name = "zeek_conn_batch_amortization"
harness = false

[[bench]]
name = "suricata_envelope_to_record_batch"
harness = false

[[bench]]
name = "sflow_to_record_batch"
harness = false

[[bench]]
name = "ipfix_flow_batch_to_record_batch"
harness = false

[[bench]]
name = "syslog_message_to_record_batch"
harness = false

[[bench]]
name = "generic_hec_to_record_batch"
harness = false

[[bench]]
name = "wef_to_record_batch"
harness = false

[[bench]]
name = "syslog_parse_recv_path"
harness = false

[profile.profiling]
inherits = "release"
debug = true
strip = false
