[package]
name = "logthing"
version = "0.20.2"
edition = "2024"
license = "MIT"

[workspace]
members = ["tools/loadgen"]
# Plain `cargo build`/`cargo test`/`cargo clippy` at the repo root (what
# rust.yml runs on every push) must keep building/testing ONLY the logthing
# package -- tools/loadgen is a manually-invoked concern, not a per-push one.
default-members = ["."]

[features]
default = ["otlp"]
kerberos-auth = ["dep:libgssapi"]
otlp = ["dep:opentelemetry-proto", "dep:prost"]
pprof = ["dep:pprof"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
headers = "0.4"
tower = { version = "0.4", features = ["limit", "util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }
# Already compiled in transitively as the axum 0.7 / hyper 1.x body types --
# named directly (pinned to the exact versions already in Cargo.lock) so
# `src/server/mod.rs`'s body-byte-budget middleware can implement
# `http_body::Body` itself and charge each request's ACTUAL streamed bytes,
# rather than a client-supplied `Content-Length` (which HTTP/2 does not let
# the server verify against real DATA-frame bytes, and which chunked
# HTTP/1.1 bodies never send at all). No new code or supply-chain surface --
# only makes an already-present crate nameable.
http-body = "=1.0.1"
http-body-util = "=0.1.3"

# TLS/SSL
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"

# XML parsing for WEF events
quick-xml = { version = "0.31", features = ["serialize"] }

# Configuration
config = "0.14"
serde_yml = "0.0.12"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.22"
# default-features disabled: we only use `PrometheusBuilder::build_recorder()`, not the
# http-listener/push-gateway features — dropping them removes the unused native-tls/openssl-sys
# C dependency, which keeps static musl release builds buildable and shrinks the binary.
metrics-exporter-prometheus = { version = "0.13", default-features = false }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# IP/network utilities
ipnet = "2.9"
# SO_RCVBUF get/set on UDP listener sockets — already an indirect dependency
# via tokio, pinned to the same 0.6 line so this doesn't add a second version.
socket2 = "0.6"
# Raw recvmmsg(2) for batched UDP receive (src/net.rs::RecvMmsgBatch).
# Already resolved transitively at this version via tokio/mio/socket2 --
# this makes it directly callable, it does not add a new dependency to the
# tree.
libc = "0.2"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"

# HTTP client for tests / admin proxy. "http2" is needed so tests can drive
# the server's h2c auto-negotiation (`axum::serve`'s `hyper_util::auto`
# builder accepts both HTTP/1.1 and h2c with no `http1_only` restriction) --
# see the real-wire body-byte-budget tests in `src/server/mod.rs`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Parquet file handling
parquet = { version = "53.0", features = ["async", "arrow"] }
arrow = "53.0"
arrow-array = "53.0"
arrow-schema = "53.0"

# S3 SDK
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.15"
aws-credential-types = "1.1"

# Additional utilities
tempfile = "3.9"
bytes = "1.5"
regex = "1.10"
async-trait = "0.1"
hex = "0.4.3"
aho-corasick = "1.1"

# Security
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
rand = "0.9.2"
subtle = "2"

# Kerberos SPNEGO auth for /wsman and friends (feature-gated). MIT-licensed —
# replaces the LGPL-3.0-or-later axum-negotiate, which is incompatible with
# static musl release binaries under this crate's MIT licence.
libgssapi = { version = "0.7", optional = true }

# OTLP ingest (feature-gated)
# opentelemetry-proto 0.32 uses prost 0.14 (brief suggested 0.7/prost-0.13 but actual latest is 0.32/prost-0.14)
# `logs` feature is required to gate tonic::logs::v1 and tonic::collector::logs::v1 modules
# `trace` is omitted — not needed for logs-only ingest
opentelemetry-proto = { version = "0.32", optional = true, default-features = false, features = [
    "gen-tonic-messages",
    "with-serde",
    "logs",
] }
prost = { version = "0.14", optional = true }

# CPU sampling profiler. Optional and excluded from `default` on purpose:
# binaries.yml cross-compiles static musl with default features only, and this
# repo has a history of C dependencies breaking those builds.
# `protobuf-codec` (pure-Rust rust-protobuf 2.x) rather than `prost-codec`:
# pprof 0.14 pins prost ^0.12 while this crate resolves prost 0.14, so
# prost-codec would add a second, incompatible prost rather than reuse ours.
pprof = { version = "0.14", default-features = false, features = [
    "flamegraph",
    "protobuf-codec",
], optional = true }

[dev-dependencies]
tempfile = "3.9"
metrics-util = { version = "0.16", features = ["debugging"] }
criterion = "0.5"
# `start_paused = true` on `#[tokio::test]` (src/net.rs's AcceptBackoff
# cancel-safety tests) needs tokio's virtual clock. Additive to the
# `features = ["full"]` main dependency and dev-only, so it does not reach
# the musl release binary.
tokio = { version = "1.35", features = ["test-util"] }

[[bench]]
name = "zeek_conn_batch_amortization"
harness = false

[[bench]]
name = "suricata_envelope_to_record_batch"
harness = false

[[bench]]
name = "sflow_to_record_batch"
harness = false

[[bench]]
name = "ipfix_flow_batch_to_record_batch"
harness = false

[[bench]]
name = "syslog_message_to_record_batch"
harness = false

[lib]
# `cargo bench` otherwise treats the lib's own test harness as a bench target
# and forwards criterion flags to it, where `--save-baseline` is unrecognized
# and aborts the whole run. The lib has no #[bench] functions; its tests run
# under `cargo test`.
bench = false

[[bin]]
name = "logthing"
path = "src/main.rs"
# Same reason as [lib] above — the bin's test harness is also a bench target by
# default, so it too would reject criterion's flags. Declared explicitly here
# only to carry this setting; otherwise it is auto-discovered from src/main.rs.
bench = false

[[bench]]
name = "generic_hec_to_record_batch"
harness = false

[[bench]]
name = "wef_to_record_batch"
harness = false

[[bench]]
name = "syslog_parse_recv_path"
harness = false

[[bench]]
name = "zeek_parse_recv_path"
harness = false

[[bench]]
name = "suricata_parse_recv_path"
harness = false

[[bench]]
name = "ipfix_decode_recv_path"
harness = false

[[bench]]
name = "sflow_decode_recv_path"
harness = false

[[bench]]
name = "zeek_schema_encode"
harness = false

[[bench]]
name = "wef_parse_recv_path"
harness = false

[[bench]]
name = "otlp_map_request"
harness = false

[[bench]]
name = "structured_syslog_to_record_batch"
harness = false

[profile.profiling]
inherits = "release"
debug = true
strip = false
