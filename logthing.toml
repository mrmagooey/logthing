bind_address = "0.0.0.0:5985"   # env: LOGTHING__BIND_ADDRESS

[logging]
level = "info"    # env: LOGTHING__LOGGING__LEVEL
format = "pretty" # env: LOGTHING__LOGGING__FORMAT

[tls]
enabled = false   # env: LOGTHING__TLS__ENABLED
port = 5986       # env: LOGTHING__TLS__PORT
# cert_file = "/path/to/cert.pem"   # env: LOGTHING__TLS__CERT_FILE
# key_file = "/path/to/key.pem"     # env: LOGTHING__TLS__KEY_FILE

[security]
# Applies to both the HTTP endpoints and the syslog/IPFIX/sFlow/Zeek/Suricata
# socket listeners. Empty allows all sources.
#
# FILE-ONLY: no environment variable equivalent. This is a list, and the
# loader sets no list separator, so LOGTHING__SECURITY__ALLOWED_IPS cannot
# set it.
#
# RESTART-ONLY: changes here (or in an `/etc/logthing/config` drop-in) only
# take effect on the next process restart. It is not editable through the
# admin interface, which is read-only.
allowed_ips = []
max_connections = 10000          # env: LOGTHING__SECURITY__MAX_CONNECTIONS
connection_timeout_secs = 300    # env: LOGTHING__SECURITY__CONNECTION_TIMEOUT_SECS

[metrics]
enabled = true   # env: LOGTHING__METRICS__ENABLED
port = 9090      # env: LOGTHING__METRICS__PORT
# bind_address = "0.0.0.0"   # env: LOGTHING__METRICS__BIND_ADDRESS

# Optional: "is ingestion working?" gauge(s) — each entry counts distinct
# values of one field, on one stream, from one source, e.g. "we have ~5000
# hosts; is /metrics reporting ~5000 distinct values?" Empty (the default)
# disables the feature entirely. `source`/`stream`/`field` are all required
# on every entry — a field with no stream is rejected at startup (watching a
# field across every stream at once is not supported), and so is an unknown
# OR disabled `source`. Valid `source` values: "zeek", "wef", "suricata",
# "syslog", "ipfix", "sflow". Multiple entries are fine, including more than
# one per source — remove the entries below (or the whole
# [[metrics.cardinality_watch]] blocks) to disable.
#
# zeek example: requires zeek to be enabled (it is disabled by default
# below). id.orig_h is an IP, not a stable host identity — DHCP churn, NAT,
# and multi-homing move the distinct-IP count independently of ingestion
# health.
# [[metrics.cardinality_watch]]
# source = "zeek"
# stream = "conn"       # zeek stream (_path) it's counted on
# field  = "id.orig_h"  # zeek field to watch
#
# WEF example: requires the WEF HTTP endpoint (always on) to actually be
# receiving events. Unlike id.orig_h, `computer` (the Computer field from
# inside the event XML) IS a stable machine identity — not an IP that
# DHCP/NAT can move around — making it a materially better "do I see all my
# hosts" signal than zeek's id.orig_h.
# [[metrics.cardinality_watch]]
# source = "wef"
# stream = "Security"  # WEF Channel it's counted on
# field  = "computer"
#
# syslog example: `stream` is the message's `app_name` (e.g. the program tag
# in "sshd: Failed password..."), not a fixed enum — RFC 3164 traffic with no
# app_name reports an empty stream, and an empty `stream` is rejected at
# startup, so that traffic can never be watched this way. `hostname` is a
# better host-identity field than an IP for the same DHCP/NAT reasons as
# zeek's id.orig_h.
# [[metrics.cardinality_watch]]
# source = "syslog"
# stream = "sshd"       # the app_name this watch counts on
# field  = "hostname"
#
# ipfix example: `stream` is the mandatory constant "flows" — IPFIX has no
# other stream concept, so this dimension carries no information and any
# other value is rejected at startup. `exporter` (the device that sent the
# flow) is the natural host-identity field here.
# [[metrics.cardinality_watch]]
# source = "ipfix"
# stream = "flows"
# field  = "exporter"
#
# Window the gauge is published and cleared on (default 3600s = 1 hour, not
# shorter: conn.log entries are emitted per-connection-CLOSE, not as a
# heartbeat, so the window must be long enough that a normally-quiet host's
# connection still closes within it).
# cardinality_window_secs = 3600
#
# Cap on distinct values tracked per window (default 100000): sized roughly
# an order of magnitude above a typical internal host count. A sensor that
# also sees external originators (not just internal hosts) can exceed this
# in normal operation — raise it and watch field_distinct_values_capped if
# the gauge sits pinned at exactly this number.
# cardinality_max_values = 100000

# Bind ports below can be overridden without editing this file, via
# LOGTHING__SYSLOG__UDP_PORT / LOGTHING__SYSLOG__TCP_PORT env vars. Unlike the other
# listeners below, syslog's bind address is fixed at 0.0.0.0 — there is no
# LOGTHING__SYSLOG__BIND_ADDRESS.
[syslog]
enabled = true      # env: LOGTHING__SYSLOG__ENABLED
udp_port = 514      # Standard syslog UDP port (env: LOGTHING__SYSLOG__UDP_PORT)
tcp_port = 601      # Standard syslog TCP port (RFC 6587) (env: LOGTHING__SYSLOG__TCP_PORT)
parse_dns = true    # Enable DNS log parsing (env: LOGTHING__SYSLOG__PARSE_DNS)

# Number of UDP receive tasks draining udp_port (default: 8; the TCP listener
# on tcp_port is unaffected). Raise when syslog_udp_socket_drops climbs while
# the process is using roughly one core. Measured recommendation: 4 — 8
# bought no further median improvement over 4 on throughput; the default is
# set to 8 anyway for headroom, since idle-cost measurement showed the knob
# is nearly free (~19 KB RSS and one file descriptor per extra socket, zero
# receive buffer memory actually charged). Only helps when there are many
# distinct senders (e.g. a fleet of hosts): SO_REUSEPORT hashes by 4-tuple,
# so a single sender always lands on the same task regardless of this value.
# Capped at 64 at config load — anything above that is rejected as a
# likely typo, since it would bind that many sockets at startup.
# recv_tasks = 8   # env: LOGTHING__SYSLOG__RECV_TASKS

# Number of datagrams one recvmmsg(2) call may return per recv task
# (default: 32). Applies to the UDP arm only. Unlike recv_tasks, this helps
# a SINGLE high-rate sender by batching already-queued datagrams into one
# syscall instead of one per datagram; the two knobs are independent and may
# be combined (recv_tasks also defaults to 8, so both are on by default). 0
# and 1 both mean batching off. Never waits to fill a batch. Raise when a
# single high-rate sender is losing datagrams (socket_drops climbing) while
# the process sits at roughly one core of CPU — that combination is the
# signature recv_tasks cannot address. Measured on ipfix, single-sender
# 50,000/s (RUNS=5): median kernel loss went from 0.72% at 1 to 0.00% at
# every setting from 4 upward — the measured win is 1 -> >=4; 32 was not
# shown to outperform 8 and is a headroom choice, costing roughly 6 MB
# resident with all three UDP listeners enabled at the default recv_tasks
# (measured for ipfix, not independently re-measured for sflow/syslog, same
# code path). Maximum 256, capped at config load — anything above that is
# rejected as a likely typo, since each unit allocates a 65535-byte buffer
# per recv task at startup.
# recv_batch_size = 32   # env: LOGTHING__SYSLOG__RECV_BATCH_SIZE

# Optional: persist syslog messages to S3 as Parquet files.
# Remove or comment out this block to disable syslog S3 persistence.
# [syslog.s3]
# endpoint             = "http://localhost:9000"   # S3-compatible endpoint
# bucket               = "syslog-logs"
# region               = "us-east-1"
# access_key           = "minioadmin"
# secret_key           = "minioadmin"
# prefix               = "syslog"                 # default: "syslog"
# max_buffer_rows      = 10000                    # flush after this many rows (default 10 000)
# flush_interval_secs  = 900                      # flush after N seconds (default 900)
# channel_capacity     = 136533                   # channel depth (default: 100 MiB budget / 768 B per message)

# Zeek NDJSON TCP listener.
# Disabled by default — set enabled = true to activate.
[zeek]
enabled      = false        # env: LOGTHING__ZEEK__ENABLED
tcp_port     = 47760       # default Zeek NDJSON listener port (env: LOGTHING__ZEEK__TCP_PORT)
bind_address = "0.0.0.0"   # env: LOGTHING__ZEEK__BIND_ADDRESS

# Optional: persist Zeek logs to S3 as per-stream Parquet files.
# Remove or comment out this block to disable Zeek S3 persistence.
# [zeek.s3]
# endpoint              = "http://localhost:9000"  # S3-compatible endpoint
# bucket                = "zeek-logs"
# region                = "us-east-1"
# access_key            = "minioadmin"
# secret_key            = "minioadmin"
# prefix                = "zeek"                  # default: "zeek"
# flush_threshold_bytes = 104857600               # flush at 100 MiB (default)
# flush_interval_secs   = 900                     # flush after N seconds (default 900)
# channel_capacity      = 40960                   # channel depth (default: 100 MiB budget / 2560 B per record)
# max_buffer_rows       = 100000                  # hard-cap before oldest rows dropped (default 100 000)

# IPFIX / NetFlow flow ingestion listener.
# Disabled by default — set enabled = true to activate.
[ipfix]
enabled      = false        # env: LOGTHING__IPFIX__ENABLED
udp_port     = 4739        # IANA-standard IPFIX port (env: LOGTHING__IPFIX__UDP_PORT)
bind_address = "0.0.0.0"   # env: LOGTHING__IPFIX__BIND_ADDRESS

# Number of UDP receive tasks draining udp_port (default: 1). Raise when
# ipfix_socket_drops climbs while the process is using roughly one core.
# Default: 8. Measured recommendation: 4 — 8 bought no
# further median improvement over 4 on throughput; the default is set to 8
# anyway for headroom, since idle-cost measurement showed the knob is nearly
# free (~19 KB RSS and one file descriptor per extra socket, zero receive
# buffer memory actually charged). Only helps when there are many
# distinct exporters: SO_REUSEPORT hashes by 4-tuple, so a single exporter
# always lands on the same task regardless of this value.
# Capped at 64 at config load — anything above that is rejected as a
# likely typo, since it would bind that many sockets at startup.
# recv_tasks = 8   # env: LOGTHING__IPFIX__RECV_TASKS

# Number of datagrams one recvmmsg(2) call may return per recv task
# (default: 32). Unlike recv_tasks, this helps a SINGLE high-rate exporter
# by batching already-queued datagrams into one syscall instead of one per
# datagram; the two knobs are independent and may be combined (recv_tasks
# also defaults to 8, so both are on by default). 0 and 1 both mean
# batching off. Never waits to fill a batch. Raise when a single high-rate
# exporter is losing datagrams (ipfix_socket_drops climbing) while the
# process sits at roughly one core of CPU — that combination is the
# signature recv_tasks cannot address. Measured single-sender 50,000/s
# (RUNS=5): median kernel loss went from 0.72% at 1 to 0.00% at every
# setting from 4 upward — the measured win is 1 -> >=4; 32 was not shown to
# outperform 8 and is a headroom choice, costing roughly 6 MB resident with
# all three UDP listeners enabled at the default recv_tasks. Maximum 256,
# capped at config load — anything above that is rejected as a likely typo,
# since each unit allocates a 65535-byte buffer per recv task at startup.
# recv_batch_size = 32   # env: LOGTHING__IPFIX__RECV_BATCH_SIZE

# Optional: persist IPFIX/NetFlow flows to S3 as Parquet files.
# Remove or comment out this block to disable IPFIX S3 persistence.
# [ipfix.s3]
# endpoint              = "http://localhost:9000"  # S3-compatible endpoint
# bucket                = "ipfix-flows"
# region                = "us-east-1"
# access_key            = "minioadmin"
# secret_key            = "minioadmin"
# prefix                = "ipfix"                 # default: "ipfix"
# flush_threshold_bytes = 104857600               # flush at 100 MiB (default)
# flush_interval_secs   = 900                     # flush after N seconds (default 900)
# channel_capacity      = 11377                   # channel depth (default: 100 MiB budget / 9216 B per datagram)
# max_buffer_rows       = 100000                  # hard-cap before oldest rows dropped (default 100 000)

# sFlow v5 UDP listener.
# Disabled by default — set enabled = true to activate.
[sflow]
enabled      = false        # env: LOGTHING__SFLOW__ENABLED
udp_port     = 6343        # Standard sFlow UDP port (env: LOGTHING__SFLOW__UDP_PORT)
bind_address = "0.0.0.0"   # env: LOGTHING__SFLOW__BIND_ADDRESS

# Number of UDP receive tasks draining udp_port (default: 8). Raise when
# sflow_socket_drops climbs while the process is using roughly one core.
# Measured recommendation: 4 — 8 bought no further median improvement over
# 4 on throughput; the default is set to 8 anyway for headroom, since
# idle-cost measurement showed the knob is nearly free (~19 KB RSS and one
# file descriptor per extra socket, zero receive buffer memory actually
# charged). Only helps when there are many distinct agents: SO_REUSEPORT
# hashes by 4-tuple, so a single agent always lands on the same task
# regardless of this value.
# Capped at 64 at config load — anything above that is rejected as a
# likely typo, since it would bind that many sockets at startup.
# recv_tasks = 8   # env: LOGTHING__SFLOW__RECV_TASKS

# Number of datagrams one recvmmsg(2) call may return per recv task
# (default: 32). Unlike recv_tasks, this helps a SINGLE high-rate agent by
# batching already-queued datagrams into one syscall instead of one per
# datagram; the two knobs are independent and may be combined (recv_tasks
# also defaults to 8, so both are on by default). 0 and 1 both mean
# batching off. Never waits to fill a batch. Raise when a single high-rate
# agent is losing datagrams (sflow_socket_drops climbing) while the process
# sits at roughly one core of CPU — that combination is the signature
# recv_tasks cannot address. Measured on ipfix, single-sender 50,000/s
# (RUNS=5): median kernel loss went from 0.72% at 1 to 0.00% at every
# setting from 4 upward — the measured win is 1 -> >=4; 32 was not shown to
# outperform 8 and is a headroom choice, costing roughly 6 MB resident with
# all three UDP listeners enabled at the default recv_tasks (measured for
# ipfix, not independently re-measured for sflow, same code path). Maximum
# 256, capped at config load — anything above that is rejected as a likely
# typo, since each unit allocates a 65535-byte buffer per recv task at
# startup.
# recv_batch_size = 32   # env: LOGTHING__SFLOW__RECV_BATCH_SIZE

# Optional: persist sFlow samples to S3 as Parquet files.
# Remove or comment out this block to disable sFlow S3 persistence.
# [sflow.s3]
# endpoint              = "http://localhost:9000"  # S3-compatible endpoint
# bucket                = "sflow-samples"
# region                = "us-east-1"
# access_key            = "minioadmin"
# secret_key            = "minioadmin"
# prefix                = "sflow"                 # default: "sflow"
# flush_threshold_bytes = 104857600               # flush at 100 MiB (default)
# flush_interval_secs   = 900                     # flush after N seconds (default 900)
# channel_capacity      = 81920                   # channel depth (default: 100 MiB budget / 1280 B per record)
# max_buffer_rows       = 100000                  # hard-cap before oldest rows dropped (default 100 000)

# Optional: emit a small JSON "descriptor" alongside every Parquet file,
# for an external Apache Iceberg committer process. logthing has no
# Iceberg dependency itself. Configure at most one of [iceberg.s3] /
# [iceberg.local] — configuring both is a startup error.
# [iceberg.s3]
# endpoint   = "http://localhost:9000"
# bucket     = "logthing-iceberg-descriptors"
# region     = "us-east-1"
# access_key = "minioadmin"
# secret_key = "minioadmin"
# prefix     = "_iceberg_descriptors"   # env: LOGTHING__ICEBERG__S3__PREFIX

# Optional log aggregation: count records as they arrive, grouped by configured
# columns, and write the counted table to Parquet instead of the raw rows.
# Disabled by default.
# [aggregate]
# enabled = true
# flush_interval_secs = 300
# max_groups = 100000
# channel_capacity = 4096
#
# [aggregate.local]
# directory = "/data/agg"
# prefix = "aggregate"
#
# FILE-ONLY: no environment variable equivalent. aggregate.rules is a list
# of tables ([[aggregate.rules]]), and the env loader has no syntax for
# setting a list of tables, so it must be configured in logthing.toml (or
# an /etc/logthing/config drop-in).
# [[aggregate.rules]]
# name = "dns_by_query"
# source = "zeek"
# stream = "dns"
# group_by = ["query", "id.orig_h"]