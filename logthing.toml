bind_address = "0.0.0.0:5985"

[logging]
level = "info"
format = "pretty"

[tls]
enabled = false
port = 5986

[security]
allowed_ips = []
max_connections = 10000
connection_timeout_secs = 300

[metrics]
enabled = true
port = 9090

# Bind ports below can be overridden without editing this file, via
# WEF__SYSLOG__UDP_PORT / WEF__SYSLOG__TCP_PORT env vars. Unlike the other
# listeners below, syslog's bind address is fixed at 0.0.0.0 — there is no
# WEF__SYSLOG__BIND_ADDRESS.
[syslog]
enabled = true
udp_port = 514      # Standard syslog UDP port (env: WEF__SYSLOG__UDP_PORT)
tcp_port = 601      # Standard syslog TCP port (RFC 6587) (env: WEF__SYSLOG__TCP_PORT)
parse_dns = true    # Enable DNS log parsing

# Optional: persist syslog messages to S3 as Parquet files.
# Remove or comment out this block to disable syslog S3 persistence.
# [syslog.s3]
# endpoint             = "http://localhost:9000"   # S3-compatible endpoint
# bucket               = "syslog-logs"
# region               = "us-east-1"
# access_key           = "minioadmin"
# secret_key           = "minioadmin"
# prefix               = "syslog"                 # default: "syslog"
# max_buffer_rows      = 10000                    # flush after this many rows (default 10 000)
# flush_interval_secs  = 900                      # flush after N seconds (default 900)
# channel_capacity     = 102400                   # channel depth (default: 100 MiB budget / ~1 KiB per message)

# Zeek NDJSON TCP listener.
# Disabled by default — set enabled = true to activate.
[zeek]
enabled      = false
tcp_port     = 47760       # default Zeek NDJSON listener port (env: WEF__ZEEK__TCP_PORT)
bind_address = "0.0.0.0"   # env: WEF__ZEEK__BIND_ADDRESS

# Optional: persist Zeek logs to S3 as per-stream Parquet files.
# Remove or comment out this block to disable Zeek S3 persistence.
# [zeek.s3]
# endpoint              = "http://localhost:9000"  # S3-compatible endpoint
# bucket                = "zeek-logs"
# region                = "us-east-1"
# access_key            = "minioadmin"
# secret_key            = "minioadmin"
# prefix                = "zeek"                  # default: "zeek"
# flush_threshold_bytes = 104857600               # flush at 100 MiB (default)
# flush_interval_secs   = 900                     # flush after N seconds (default 900)
# channel_capacity      = 102400                   # channel depth (default: 100 MiB budget / ~1 KiB per record)
# max_buffer_rows       = 100000                  # hard-cap before oldest rows dropped (default 100 000)

# IPFIX / NetFlow flow ingestion listener.
# Disabled by default — set enabled = true to activate.
[ipfix]
enabled      = false
udp_port     = 4739        # IANA-standard IPFIX port (env: WEF__IPFIX__UDP_PORT)
bind_address = "0.0.0.0"   # env: WEF__IPFIX__BIND_ADDRESS

# Optional: persist IPFIX/NetFlow flows to S3 as Parquet files.
# Remove or comment out this block to disable IPFIX S3 persistence.
# [ipfix.s3]
# endpoint              = "http://localhost:9000"  # S3-compatible endpoint
# bucket                = "ipfix-flows"
# region                = "us-east-1"
# access_key            = "minioadmin"
# secret_key            = "minioadmin"
# prefix                = "ipfix"                 # default: "ipfix"
# flush_threshold_bytes = 104857600               # flush at 100 MiB (default)
# flush_interval_secs   = 900                     # flush after N seconds (default 900)
# channel_capacity      = 12800                    # channel depth (default: 100 MiB budget / ~8 KiB per datagram)
# max_buffer_rows       = 100000                  # hard-cap before oldest rows dropped (default 100 000)

# Optional: emit a small JSON "descriptor" alongside every Parquet file,
# for an external Apache Iceberg committer process. logthing has no
# Iceberg dependency itself. Configure at most one of [iceberg.s3] /
# [iceberg.local] — configuring both is a startup error.
# [iceberg.s3]
# endpoint   = "http://localhost:9000"
# bucket     = "logthing-iceberg-descriptors"
# region     = "us-east-1"
# access_key = "minioadmin"
# secret_key = "minioadmin"
# prefix     = "_iceberg_descriptors"   # env: WEF__ICEBERG__S3__PREFIX