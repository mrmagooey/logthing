[package]
name = "loadgen"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
logthing = { path = "../.." }
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
serde_json = "1.0"
# Same feature set as the root crate's HTTP client dependency (json,
# rustls-tls, no native-tls) -- reused rather than re-picked so this crate
# doesn't drag in a second TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# For the in-process integration tests that drive generated request bodies
# through logthing's real axum handlers (`tower::ServiceExt::oneshot`),
# matching the harness shape `src/server/mod.rs`'s own HEC route tests use.
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
