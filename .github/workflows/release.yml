name: Release container

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/logthing

jobs:
  # One platform per NATIVE runner, then a manifest list stitched from the
  # resulting digests.
  #
  # This used to be a single job building linux/amd64,linux/arm64 together under
  # QEMU. Emulating aarch64 means rustc and every C dependency run through an
  # instruction interpreter, and it dominated the pipeline: cold releases took
  # 1.5-2.5h, of which the amd64 leg was ~5min. binaries.yml builds the same
  # aarch64 target in ~6min because cargo-zigbuild cross-compiles rather than
  # emulates. GitHub's arm64 runners are free for public repos, so each platform
  # now builds on hardware that matches it and no emulation is involved.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-qemu-action: needing it would mean a platform is being emulated
      # again, which is the ~2h regression this split exists to prevent.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # A filesystem-safe form of the platform for artifact and cache naming:
      # `linux/amd64` -> `linux-amd64`.
      - name: Derive platform slug
        id: slug
        run: echo "value=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tags are applied by the merge job, not here: each matrix leg pushes
          # an untagged single-platform image and reports its digest, so the two
          # legs cannot race to overwrite the same tag.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache rather than type=gha: the v0.9.0 release died after
          # 1h57m with `failed to solve: not_found` -- a GHA-cache blob that was
          # evicted (10GB per-repo LRU, shared with the rust.yml/binaries.yml
          # caches) partway through the build. GHCR is already authenticated
          # above and has no such eviction window. ignore-error keeps a cache
          # hiccup from failing a release outright.
          #
          # The ref is per-platform: the two legs run concurrently and a shared
          # ref would have them overwriting each other's cache manifest.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.slug.outputs.value }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.slug.outputs.value }},mode=max,ignore-error=true

      # The digest is the only thing the merge job needs. Passing it as an empty
      # file named after the digest lets the merge job glob them together
      # without caring how many platforms there were.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-platform digests into one tagged manifest list. Only this
  # job applies the release tags, so a partial build never publishes a tag
  # pointing at a single architecture.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # SC2046 word splitting is the point here: the jq call expands to one
          # `-t <tag>` pair per release tag, and the printf to one `image@sha256:`
          # reference per platform digest. Quoting either would collapse it into
          # a single argument.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
