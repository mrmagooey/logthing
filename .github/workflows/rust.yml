name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Build
      run: cargo build --verbose

    - name: Start test S3 server (docker)
      # The script prints `export K=V K=V ...`; convert to GITHUB_ENV lines.
      # LOGTHING_REQUIRE_S3_TESTS makes the *_s3_integration and object_lock
      # tests fail instead of skip if MINIO_ENDPOINT is ever missing.
      shell: bash
      run: |
        out="$(scripts/s3-test-env.sh up)"
        vars="$(printf '%s\n' "$out" | sed 's/^export //' | tr ' ' '\n')"
        if printf '%s\n' "$vars" | grep -qvE '^[A-Z_0-9]+='; then
          echo "unexpected s3-test-env.sh output:" >&2
          printf '%s\n' "$out" >&2
          exit 1
        fi
        printf '%s\n' "$vars" >> "$GITHUB_ENV"
        echo "LOGTHING_REQUIRE_S3_TESTS=1" >> "$GITHUB_ENV"

    - name: Run tests
      run: cargo test --verbose

    - name: Run loadgen tests
      # tools/loadgen is outside the workspace default-members, so plain `cargo test` never
      # builds it; its tests drive logthing's real handlers and break when those change.
      run: cargo test -p loadgen --verbose

    - name: Compile-check criterion benchmarks (no execution)
      # Full sampled criterion runs are deliberately NOT run on every push --
      # measured cost: an uncached bench-profile compile of the full
      # dependency tree took several minutes on its own, plus ~2-3 min of
      # execution across all bench targets, none of it shared with the
      # build/test steps above. This step only proves the benchmark files
      # still compile against the current ParquetSink trait surface; actual
      # timing runs live in the manually-triggered performance.yml workflow.
      run: cargo bench --no-run --verbose

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy (default features)
      run: cargo clippy --all-targets -- -D warnings

    - name: Clippy (loadgen)
      run: cargo clippy -p loadgen --all-targets -- -D warnings

    - name: Security audit
      # Non-fatal: advisory DB entries can fire on transitive deps we don't
      # control.  We log the result so it's visible in CI without blocking
      # merges.  Tighten to `cargo audit` (no `|| true`) once the advisory
      # backlog is clear.
      run: |
        cargo install cargo-audit --quiet
        cargo audit || true

    - name: Stop test S3 server
      if: always()
      run: scripts/s3-test-env.sh down

  build-kerberos:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Install Kerberos development libraries
      run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

    - name: Build (kerberos-auth feature)
      run: cargo build --features kerberos-auth --verbose

    - name: Start test KDC (docker)
      # The script prints `export K=V K=V ...`; convert to GITHUB_ENV lines.
      # tests/wef_kerberos_integration.rs hard-fails under CI=true if these
      # are missing, so the real-Kerberos test cannot silently skip.
      shell: bash
      run: |
        out="$(scripts/kdc-test-env.sh up)"
        vars="$(printf '%s\n' "$out" | sed 's/^export //' | tr ' ' '\n')"
        if printf '%s\n' "$vars" | grep -qvE '^[A-Z_0-9]+='; then
          echo "unexpected kdc-test-env.sh output:" >&2
          printf '%s\n' "$out" >&2
          exit 1
        fi
        printf '%s\n' "$vars" >> "$GITHUB_ENV"

    - name: Run tests (kerberos-auth feature)
      run: cargo test --features kerberos-auth --verbose

    - name: Clippy (kerberos-auth feature)
      run: cargo clippy --features kerberos-auth -- -D warnings

    - name: Stop test KDC
      if: always()
      run: scripts/kdc-test-env.sh down

  build-pprof:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Build (pprof)
      run: cargo build --features pprof --verbose

    - name: Run tests (pprof)
      run: cargo test --features pprof --verbose

    - name: Clippy (pprof)
      # --all-targets, unlike build-kerberos: tests/profiling_integration.rs is
      # wholly #![cfg(feature = "pprof")], so this job is the only place in CI
      # where it is ever linted. kerberos has no feature-gated test file, so its
      # omission of the flag costs nothing; here it would be a real gap.
      run: cargo clippy --features pprof --all-targets -- -D warnings

  build-jemalloc:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    # jemalloc is only linked on musl in release builds; this job exercises the same code path on
    # gnu on every push so a break in it is not first seen on a tag push.
    - name: Build (jemalloc)
      run: cargo build --features jemalloc --verbose

    - name: Run tests (jemalloc)
      run: cargo test --features jemalloc --verbose

    - name: Clippy (jemalloc)
      run: cargo clippy --features jemalloc --all-targets -- -D warnings
