name: Performance

# Performance-testing tier, run on every release tag and on demand,
# deliberately separate from rust.yml's per-push job -- sustained load runs
# and full-sampled criterion benchmarks cost minutes, not seconds, and measure
# throughput/latency/resource-usage, not pass/fail correctness -- a different
# signal than what runs on every push. Two jobs: `criterion` (full sampled
# micro-benchmarks) and `ingest-formats` (scripts/profile-ingest.sh: all nine
# ingest formats under fixed load, flame graphs plus peak RSS and CPU per
# record). Each job appends a markdown table (scripts/perf-summary.py) to the
# run's step summary. Results are informational; a tag run does not gate the
# release (release.yml and binaries.yml run independently), and one format's
# FAIL verdict is a warning, not a job failure. A tag push carries no inputs,
# so every input use below falls back to the same default as its
# workflow_dispatch input.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      formats:
        description: 'space-separated profile-ingest.sh format names, or all'
        required: false
        default: 'all'
      duration_secs:
        description: 'sampling window per format, seconds (>= 10)'
        required: false
        default: '25'

env:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++

jobs:
  criterion:
    name: Criterion benchmarks (full sampled run)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run all criterion benchmarks
        run: cargo bench -- --save-baseline ci-${{ github.sha }}

      # Without this the job runs the full sampled suite and then throws every
      # number away — target/ is not persisted, so a CI bench run could not be
      # read after it finished. The sibling ingest-formats job in this
      # file already uploads its artifacts; this brings criterion into line.
      - name: Upload criterion results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline-${{ github.sha }}
          path: target/criterion/
          retention-days: 30

      # cargo bench writes estimates under both new/ and ci-<sha>/; read the named one.
      - name: Summarise criterion results
        if: always()
        run: |
          python3 scripts/perf-summary.py --criterion target/criterion \
            --baseline ci-${{ github.sha }} >> "$GITHUB_STEP_SUMMARY"

  ingest-formats:
    name: Ingest formats (flame graphs, RSS, CPU per record)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build logthing (profiling profile, pprof)
        run: cargo build --profile profiling --features pprof

      - name: Build loadgen (release)
        run: cargo build --release -p loadgen

      # Exit 1 = at least one format got a FAIL verdict: warn and continue so the
      # artifact and summary table are still produced. Exit 2 (usage) or no
      # summary.json at all is a real failure. FORMATS is deliberately unquoted
      # so it word-splits into one argument per format.
      - name: Profile ingest formats
        env:
          FORMATS: ${{ inputs.formats || 'all' }}
          DURATION: ${{ inputs.duration_secs || '25' }}
          OUT: ${{ github.workspace }}/profiling-results
        run: |
          set +e
          scripts/profile-ingest.sh $FORMATS 2>&1 | tee profile-ingest.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 1 ]; then
            failed=$(grep '^FAILED:' profile-ingest.log | tail -1)
            echo "::warning::profile-ingest.sh reported failing formats: ${failed#FAILED: }"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::profile-ingest.sh exited with status $rc"
            exit "$rc"
          fi
          ls "$OUT"/*/summary.json > /dev/null 2>&1 || {
            echo "::error::no summary.json was produced under $OUT"
            exit 1
          }

      - name: Upload ingest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-formats-${{ github.sha }}
          path: profiling-results/
          retention-days: 30

      - name: Summarise ingest results
        if: always()
        run: |
          python3 scripts/perf-summary.py --ingest profiling-results >> "$GITHUB_STEP_SUMMARY"
