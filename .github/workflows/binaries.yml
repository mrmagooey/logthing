name: Binaries

# Builds static (musl) release binaries for linux/amd64 and linux/arm64 and
# attaches them to the GitHub Release for the pushed tag. Complements
# release.yml (which builds the container image on the same `v*` tags) and
# rust.yml (which runs the test suite on every push/PR).
on:
  push:
    tags:
      - 'v*'
  # Manual runs validate the (cross-)build via dry-run without needing a tag —
  # useful for confirming the aarch64-musl build before cutting a real release.
  workflow_dispatch:

permissions:
  contents: write # required to create the release / attach assets to it

jobs:
  # upload-rust-binary-action (below) only attaches assets to an *existing*
  # GitHub Release — it does not create one. On a real tag push we create it
  # here first; workflow_dispatch (dry-run) has no tag, so this is skipped and
  # `build` proceeds without a release to upload to.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.target }}
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # jemalloc is linked automatically on every musl target (target dependency in Cargo.toml).
      # aarch64 kernels use 4K or 64K pages; a 64 KiB jemalloc page size is valid on both.
      - name: Set jemalloc page size (aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> "$GITHUB_ENV"

      # Guard, part 1: build exactly as the action below does (same target/profile/bin; no
      # --locked or extra env is configured for the action) and fail the job BEFORE anything is
      # uploaded if jemalloc is not linked. The action's own build then hits cargo's cache.
      #
      # upload-rust-binary-action does not install zig itself: with build-tool: cargo-zigbuild it
      # runs `pip3 install cargo-zigbuild` only if cargo-zigbuild is missing from PATH, and it
      # adds --locked only when its `locked:` input is true (it is not set). Installing both here
      # means the action reuses this zig. Pinned to the version this guard was tested with. The
      # action exports CARGO_PROFILE_RELEASE_STRIP=debuginfo, so the guard build sets the same
      # to match it and let the action hit cargo's cache; the post-action re-check below is the
      # authoritative guard. The check scans string literals (release binaries have no symbol table).
      - name: Install zig (guard build)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild (guard build)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Guard - build and assert jemalloc is linked
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} --bin logthing
          scripts/check-jemalloc-symbols.sh target/${{ matrix.target }}/release/logthing

      - name: Guard - start the x86_64 binary and assert allocator=jemalloc
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/check-jemalloc-symbols.sh target/${{ matrix.target }}/release/logthing --run

      - name: Build static binary and attach to release
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: logthing
          target: ${{ matrix.target }}
          # cargo-zigbuild supplies a zig-based cross C toolchain so the native
          # C dependencies (aws-lc-sys, zstd-sys) cross-compile cleanly to the
          # musl/arm64 targets. The action installs zig + cargo-zigbuild for us.
          build-tool: cargo-zigbuild
          # Default features (otlp on). kerberos-auth is intentionally NOT enabled:
          # it dynamically links libkrb5 and cannot be linked into a static musl binary.
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,logthing.toml
          # Tag pushes upload assets to the matching GitHub Release. Manual
          # workflow_dispatch runs (no tag) build + archive only, validating the
          # cross-compile without a release to upload to.
          dry-run: ${{ !startsWith(github.ref, 'refs/tags/') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Guard, part 2: the binary the action actually built must still contain jemalloc.
      - name: Guard - re-check the built binary
        run: scripts/check-jemalloc-symbols.sh target/${{ matrix.target }}/release/logthing
