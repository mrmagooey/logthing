# WEF interop e2e, topology (b): HTTPS with client certificates issued by the test CA.
[logging]
level = "info"
format = "pretty"

[tls]
enabled = true
port = 5986
cert_file = "/etc/logthing/certs/server.crt"
key_file = "/etc/logthing/certs/server.key"
ca_file = "/etc/logthing/certs/ca.crt"
require_client_cert = true

[wef]
collector_url = "https://logthing-tls.example.com:5986"

[[wef.subscriptions]]
name     = "security"
uuid     = "0F1E2D3C-4B5A-6978-8796-A5B4C3D2E1F1"
channels = ["Security"]

[wef.local]
directory             = "/var/log/wef-local"
flush_threshold_bytes = 1
flush_interval_secs   = 2

[iceberg.local]
directory = "/var/log/iceberg-local"
prefix    = "_iceberg_descriptors"
