[logging]
level = "info"
format = "pretty"

[metrics]
enabled = true
port = 9100

[syslog]
enabled = true
udp_port = 5514
tcp_port = 5601
parse_dns = true

[syslog.s3]
endpoint   = "http://minio:9000"
bucket     = "wef-events"
region     = "us-east-1"
access_key = "miniouser"
secret_key = "miniopassword"
prefix     = "syslog"
max_buffer_rows     = 10
flush_interval_secs = 5

[ipfix]
enabled = true
udp_port = 4739

[ipfix.s3]
endpoint   = "http://minio:9000"
bucket     = "ipfix-flows"
region     = "us-east-1"
access_key = "miniouser"
secret_key = "miniopassword"
prefix     = "ipfix"
flush_threshold_bytes = 1
flush_interval_secs   = 5

[ipfix.local]
directory             = "/var/log/ipfix-local"
prefix                = "ipfix"
flush_threshold_bytes = 1
flush_interval_secs   = 5

[zeek]
enabled = true
tcp_port = 47760

[zeek.s3]
endpoint   = "http://minio:9000"
bucket     = "zeek-logs"
region     = "us-east-1"
access_key = "miniouser"
secret_key = "miniopassword"
prefix     = "zeek"
flush_threshold_bytes = 1
flush_interval_secs   = 5

[zeek.local]
directory             = "/var/log/zeek-local"
prefix                = "zeek"
flush_threshold_bytes = 1
flush_interval_secs   = 5

[wef]
collector_url = "http://logthing:5985"
allow_unauthenticated = true

[[wef.subscriptions]]
name     = "security"
uuid     = "0F1E2D3C-4B5A-6978-8796-A5B4C3D2E1F0"
channels = ["Security"]

[wef.s3]
endpoint   = "http://minio:9000"
bucket     = "wef-events"
region     = "us-east-1"
access_key = "miniouser"
secret_key = "miniopassword"
# prefix defaults to "" (empty) — preserves event_type=.../year=... layout at root
flush_threshold_bytes = 1
flush_interval_secs   = 5

[wef.local]
directory             = "/var/log/wef-local"
flush_threshold_bytes = 1
flush_interval_secs   = 5

# Local-disk only (no `[hec.s3]`) -- minio-setup only pre-creates the
# wef-events/ipfix-flows/zeek-logs buckets, and local-disk persistence is
# already sufficient to prove records were accepted and written, same as
# how the `*-local-verifier` services check zeek/ipfix.
[hec]
enabled = true
token   = "e2e-hec-token"

[hec.local]
directory             = "/var/log/hec-local"
prefix                = "hec"
flush_threshold_bytes = 1
flush_interval_secs   = 5

[iceberg.local]
directory = "/var/log/iceberg-local"
prefix    = "_iceberg_descriptors"

# OTLP/HTTP logs: local-disk sink only (same reasoning as [hec] above). The bearer token is
# exercised by otlp-generator (a wrong token must be rejected with 401).
[otlp]
enabled      = true
bearer_token = "e2e-otlp-token"

[otlp.local]
directory             = "/var/log/otlp-local"
prefix                = "otlp"
flush_threshold_bytes = 1
flush_interval_secs   = 5
