[logging]
level = "info"
format = "pretty"

[metrics]
enabled = true
port = 9100

[syslog]
enabled = true
udp_port = 5514
tcp_port = 5601
parse_dns = true

[wef]
collector_url = "http://logthing-10k-sustained:5985"
allow_unauthenticated = true

[[wef.subscriptions]]
name     = "security"
uuid     = "0F1E2D3C-4B5A-6978-8796-A5B4C3D2E1F0"
channels = ["Security"]

[wef.s3]
endpoint   = "http://minio:9000"
bucket     = "wef-events"
region     = "us-east-1"
access_key = "miniouser"
secret_key = "miniopassword"
# prefix defaults to "" (empty) — preserves event_type=.../year=... layout at root
flush_threshold_bytes = 104857600
flush_interval_secs   = 60
