# Test-only config. Compose clients reach the KDC at kdc.example.com; the host
# variant (localhost:<mapped port>) is generated by scripts/kdc-test-env.sh.
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_canonicalize_hostname = false
    rdns = false
    dns_lookup_kdc = false
    dns_lookup_realm = false
    # Force TCP: UDP through docker port mappings is flaky.
    udp_preference_limit = 1

[realms]
    EXAMPLE.COM = {
        kdc = kdc.example.com:88
        admin_server = kdc.example.com:749
    }

[domain_realm]
    .example.com = EXAMPLE.COM
    example.com = EXAMPLE.COM

[logging]
    kdc = STDERR
    admin_server = STDERR
    default = STDERR
